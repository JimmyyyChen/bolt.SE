<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img"><title>Test constraints and execution feedback</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67636e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#292929"><rect x="20" y="30" width="164" height="64" fill="#f1edfc" stroke="#80728f"/><text x="102.0" y="56" text-anchor="middle" font-size="14">Provide test cases</text><text x="102.0" y="76" text-anchor="middle" font-size="14">as constraints</text><path d="M184 62 L214 62" fill="none" stroke="#67636e" stroke-width="1.4" marker-end="url(#a)"/><rect x="220" y="30" width="164" height="64" fill="#f6f6f9" stroke="#bdbdbd"/><text x="302.0" y="56" text-anchor="middle" font-size="14">Generate or repair</text><text x="302.0" y="76" text-anchor="middle" font-size="14">application code</text><path d="M384 62 L414 62" fill="none" stroke="#67636e" stroke-width="1.4" marker-end="url(#a)"/><rect x="420" y="30" width="164" height="64" fill="#f1edfc" stroke="#80728f"/><text x="502.0" y="56" text-anchor="middle" font-size="14">Execute tests</text><text x="502.0" y="76" text-anchor="middle" font-size="14">in WebContainer</text><path d="M584 62 L614 62" fill="none" stroke="#67636e" stroke-width="1.4" marker-end="url(#a)"/><rect x="620" y="30" width="164" height="64" fill="#f1edfc" stroke="#80728f"/><text x="702.0" y="56" text-anchor="middle" font-size="14">Collect and display</text><text x="702.0" y="76" text-anchor="middle" font-size="14">test results</text><path d="M702 97 V157 H302 V100" fill="none" stroke="#67636e" stroke-width="1.4" marker-end="url(#a)"/><text x="500" y="145" text-anchor="middle" font-size="13">On failure: return diagnostics, repair code, and run again</text><text x="20" y="210" text-anchor="start" font-size="13">Added mechanism: test constraints and failure feedback connect generation to execution.</text></g></svg>